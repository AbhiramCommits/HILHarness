[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hilharness"
version = "0.1.0"
description = "Hardware-in-the-Loop test harness and validation framework for an embedded Linux target"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HILHarness" }]
dependencies = [
    "pytest>=7.4",
    "python-can>=4.3",
    "cantools>=39.4",
    "pyserial>=3.5",
    "psutil>=5.9",
    "click>=8.1",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.1",
    "pytest-timeout>=2.2",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.9",
    "types-PyYAML>=6.0",
]

[project.scripts]
hil = "hilharness.cli:main"

[tool.setuptools.packages.find]
include = ["hilharness*", "simtarget*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "hil: hardware-in-the-loop suite tests",
    "sim: runs against the simulated target",
    "hw: requires real hardware",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["hilharness"]
omit = ["hilharness/cli.py", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
