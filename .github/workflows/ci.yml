name: HIL CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: lint + typecheck (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check hilharness simtarget tests scripts
      - name: black
        run: black --check hilharness simtarget tests scripts
      - name: mypy
        run: mypy hilharness simtarget

  native:
    name: build native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C native
      - name: smoke-test bootprobe
        run: printf '[    0.000000] hil-stage bootloader begin\n[    0.500000] hil-stage kernel begin\n[    1.000000] hil-stage userspace begin\n[    1.000000] hil-driver display probe 100.0 ms\n[    1.200000] hil-stage userspace ready\n' | native/bootprobe
      - uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: |
            native/bootprobe
            native/can_node

  test:
    name: HIL suites (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: native
        continue-on-error: true
      - name: build native (fallback)
        run: make -C native
      - name: setup vcan (non-fatal)
        run: bash scripts/setup_vcan.sh || echo "vcan unavailable; using virtual bus"
      - name: show CAN backend
        run: python -c "from hilharness.config import RigConfig; from hilharness.drivers.canbus import CanBus; b=CanBus(RigConfig.from_yaml('configs/rig_sim.yaml').can); print('CAN backend:', b.backend); b.close()"
      - name: pytest (coverage gate)
        run: |
          pytest -m "hil and sim" \
            --cov=hilharness --cov-report=term-missing --cov-fail-under=80 \
            --junitxml=results/junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python-version }}
          path: results/junit.xml

  soak:
    name: soak + release gates
    runs-on: ubuntu-latest
    needs: [native, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: make -C native
      - name: setup vcan (non-fatal)
        run: bash scripts/setup_vcan.sh || echo "vcan unavailable; using virtual bus"
      - name: generate suite results JSON
        run: hil run --suite all --config configs/rig_sim.yaml || true
      - name: soak 30 cycles
        run: hil soak --cycles 30 --config configs/rig_sim.yaml
      - name: prometheus textfile
        run: hil prom --config configs/rig_sim.yaml
      - name: release-readiness report (gates)
        run: |
          set +e
          hil report --config configs/rig_sim.yaml
          code=$?
          echo "## HIL release-readiness" >> "$GITHUB_STEP_SUMMARY"
          cat reports/release_readiness.md >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hil-reports
          path: |
            reports/release_readiness.md
            reports/release_readiness.json
            reports/baseline.json
            results/junit.xml
            results/hil_metrics.prom
            results/hil_results.json
            results/soak_summary.json
